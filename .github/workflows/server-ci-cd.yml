name: Server CI/CD & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'docker-compose.yml'
      - '.github/workflows/server-ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'server/**'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  test-server:
    name: Run Automated Tests & Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Run Testsuite (Security, Matching, iCal Split & DayPlanner Emulation)
        run: |
          cd server
          NODE_ENV=test npm test

  deploy-server:
    name: Deploy to 24/7 Production Server (VPS)
    needs: test-server
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Production Server
        uses: appleboy/ssh-action@v1.2.0
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.PROD_HOST || secrets.SERVER_HOST || '82.165.110.152' }}
          USER: ${{ secrets.PROD_USER || secrets.SERVER_USER || 'jayv' }}
          PORT: ${{ secrets.PROD_PORT || secrets.SERVER_PORT || '22' }}
          TARGET_DIR: ${{ secrets.PROD_DEPLOY_PATH || secrets.SERVER_PATH || '/home/jayv/vrijcheckapp' }}
        if: env.SSH_KEY != '' && env.HOST != ''
        with:
          host: ${{ env.HOST }}
          username: ${{ env.USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.PORT }}
          envs: TARGET_DIR
          script: |
            echo "🚀 Deploying Teamwork Vrijcheck v2.0 (MySQL + phpMyAdmin + 24/7 Daemon) to $TARGET_DIR..."
            if [ ! -d "$TARGET_DIR" ]; then
              mkdir -p "$TARGET_DIR"
              git clone https://github.com/jayverrijt/AutoChecker.git "$TARGET_DIR"
            fi
            cd "$TARGET_DIR"
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main

            if [ -f "/home/jayv/AutoChecker/server/data/users.json" ] && [ ! -f "$TARGET_DIR/server/data/users.json" ]; then
              mkdir -p "$TARGET_DIR/server/data"
              cp "/home/jayv/AutoChecker/server/data/users.json" "$TARGET_DIR/server/data/users.json" || true
            fi
            
            if command -v docker >/dev/null 2>&1; then
              docker rm -f vrijcheck-24-7 >/dev/null 2>&1 || true
              docker compose up -d --build
              echo "✅ Docker Compose stack (vrijcheck-db, vrijcheck-phpmyadmin, vrijcheck-24-7) rebuilt and restarted!"
            elif command -v pm2 >/dev/null 2>&1; then
              cd server
              npm ci --only=production
              pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
              pm2 save
              echo "✅ PM2 process reloaded successfully!"
            else
              echo "⚠️ Neither Docker nor PM2 found. Please check host environment."
            fi
