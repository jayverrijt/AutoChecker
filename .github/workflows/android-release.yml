name: Android APK Build & Release

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/android-release.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd client
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p build-artifacts
          cp client/android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/AutoChecker-Android-Debug.apk
          echo "APK_PATH=build-artifacts/AutoChecker-Android-Debug.apk" >> $GITHUB_ENV

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoChecker-Android-Debug-APK
          path: build-artifacts/AutoChecker-Android-Debug.apk
          retention-days: 30

      - name: Create GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/AutoChecker-Android-Debug.apk
          name: AutoChecker Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
