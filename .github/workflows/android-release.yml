name: Android APK Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: android-build-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci --include=dev

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd client
          npm run cap:sync || npx --yes @capacitor/cli sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APKs (Release & Debug)
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare APKs for Distribution
        run: |
          mkdir -p build-artifacts
          if [ -f client/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp client/android/app/build/outputs/apk/release/app-release.apk build-artifacts/Teamwork-Vrijcheck.apk
            cp client/android/app/build/outputs/apk/release/app-release.apk build-artifacts/AutoChecker-Android-Release.apk
          fi
          if [ -f client/android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp client/android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/AutoChecker-Android-Debug.apk
          fi
          ls -la build-artifacts/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Teamwork-Vrijcheck-Android-APKs
          path: build-artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*.apk
          name: Teamwork Vrijcheck ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Update Latest Continuous Release (on main branch push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*.apk
          name: Teamwork Vrijcheck (Continuous Latest Build)
          tag_name: latest
          draft: false
          prerelease: true
          generate_release_notes: true
